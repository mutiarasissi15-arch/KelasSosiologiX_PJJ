.tbtn{min-height:48px;display:flex;align-items:center;justify-content:center;font-size:16px;padding:.5rem .75rem;text-align:center}
.chk{display:flex;align-items:center;gap:.75rem;min-height:48px;font-weight:500}
.chk input{width:24px;height:24px;min-height:0;margin:0;flex:none}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin:.5rem 0}
.tbl th{background:#4a90c8;color:#fff;text-align:left;padding:.5rem}
.tbl td{border:1px solid #dbe4ef;padding:.5rem;vertical-align:top;background:#fff}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:.625rem;margin:.25rem 0 .8rem}
.emo{display:inline-block;animation:floaty 3s ease-in-out infinite;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
@keyframes floaty{50%{transform:translateY(-5px) rotate(-6deg)}}
.emo.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.55) rotate(12deg)}100%{transform:scale(1)}}
.fly{position:fixed;z-index:50;font-size:22px;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),-90px) scale(1.3);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tab{min-height:48px;border-radius:.9rem;font-size:16px;font-weight:700;background:#eef3fa;color:#5d6d80;border:1.5px solid #dbe4ef;transition:.2s}
.tab:active{transform:scale(.96)}
.tab.on{background:linear-gradient(135deg,#5b9bd5,#6c7be0);color:#fff;border-color:transparent;box-shadow:0 4px 10px #6c7be040}
#demo{position:sticky;top:0;z-index:30}
.card{background:#fff;border-radius:1.25rem;box-shadow:0 2px 12px #3b5b8a14;padding:1rem;margin-bottom:.8rem}
.btn{background:linear-gradient(135deg,#5b9bd5,#6c7be0);color:#fff;border-radius:.9rem;padding:.75rem 1rem;min-height:48px;font-size:16px;font-weight:600;width:100%;transition:.2s}
.btn.pink{background:linear-gradient(135deg,#f08ab0,#e8678f)}
.btn:active{transform:scale(.97)}
input,select,textarea{border:1.5px solid #dbe4ef;border-radius:.8rem;padding:.65rem .8rem;min-height:48px;font-size:16px;width:100%;background:#fff;margin:.25rem 0 .7rem}
input[readonly]{background:#f4f7fb;color:#5d6d80}
input:focus,select:focus,textarea:focus{outline:none;border-color:#6c9ff0;box-shadow:0 0 0 3px #6c9ff033}
label{font-size:16px;font-weight:600;display:block}
.tag{font-size:.7rem;padding:.2rem .65rem;border-radius:99px;font-weight:700;display:inline-flex;align-items:center;gap:.25rem}
.mcard{transition:transform .2s,box-shadow .2s}
.mcard:hover{transform:translateY(-3px);box-shadow:0 10px 24px #3b5b8a26}
.mcard:active{transform:scale(.98)}
.glow{box-shadow:0 0 0 0 #34d39980;animation:glow 2s infinite}
@keyframes glow{70%{box-shadow:0 0 0 8px #34d39900}100%{box-shadow:0 0 0 0 #34d39900}}
.bar{transition:width 1s cubic-bezier(.2,.8,.2,1)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
nav a{color:#8a99ad;transition:.2s;min-height:56px;justify-content:center}
nav a .pill{width:3.2rem;height:1.9rem;border-radius:99px;display:flex;align-items:center;justify-content:center;transition:.25s}
nav a.on{color:#e0577f;font-weight:700}
nav a.on .pill{background:#fde4ec;transform:translateY(-3px)}
nav svg{width:1.4rem;height:1.4rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

cc2','Dokumen','Menelaah arsip dan data resmi.']]);\nILL[5]=et('Simulasi peneliti muda',[['\ud83e\uddd1\u200d\ud83c\udf93','Dinda'],['\ud83d\udcf1','Gawai'],['\ud83d\udcca','Data','Fakta yang dikumpulkan secara sistematis.']]);\nILL[7]=et('Berpikir tingkat tinggi',[['\ud83e\udde0','Analisis'],['\u2696\ufe0f','Evaluasi'],['\ud83d\udee0\ufe0f','Cipta']]);\nILL[9]=et('Evaluasi konsep',[['\ud83e\udde9','Konsep'],['\ud83e\uddea','Metode'],['\ud83d\udce3','Hasil']]);\nILL[8]=et('Jurnal refleksi',[['\ud83d\udcd3','Catat'],['\u270d\ufe0f','Rancang'],['\ud83c\udf31','Tumbuh']]);\nvar DEEP={1:'<details class=\"card\"><summary>\ud83d\udd0e Ciri penelitian ilmiah<\/summary><ul><li><b>Empiris<\/b>: berdasar fakta yang dapat diamati.<\/li><li><b>Sistematis<\/b>: berurutan dan terencana.<\/li><li><b>Objektif<\/b>: menekan prasangka peneliti.<\/li><li><b>Dapat diuji ulang<\/b>: orang lain bisa memeriksa caranya.<\/li><\/ul><\/details><details class=\"card\"><summary>\u2696\ufe0f Fakta, opini, dan imajinasi sosiologis<\/summary><p><b>Fakta<\/b>: \u201cSebagian besar siswa kelas X membawa gawai.\u201d Ini bisa diverifikasi. <b>Opini<\/b>: \u201cGawai membuat siswa malas.\u201d Ini penilaian yang butuh bukti. Menurut C. Wright Mills, <i>imajinasi sosiologis<\/i> melatih kita menghubungkan pengalaman pribadi (misalnya teman yang asyik bergawai) dengan pola sosial yang lebih luas (budaya digital, ekonomi, pendidikan).<\/p><\/details><details class=\"card\"><summary>\ud83c\udf10 Bermakna: objektivitas bagi warga digital<\/summary><p>Sikap objektif yang kamu latih di sini dipakai setiap hari: membedakan <b>fakta<\/b> dari opini dan hoaks di media sosial, menahan diri menyimpulkan dari satu video atau tangkapan layar, dan bertanya \"apa buktinya?\" sebelum percaya.<\/p><\/details>',\n2:'<details class=\"card\"><summary>\ud83d\udcda Teknik pengumpulan data<\/summary><ul><li><b>Observasi<\/b>: mengamati perilaku langsung.<\/li><li><b>Wawancara<\/b>: menggali alasan dan makna.<\/li><li><b>Angket<\/b>: pertanyaan tertulis untuk banyak orang.<\/li><li><b>Studi dokumen<\/b>: menelaah arsip dan data resmi.<\/li><\/ul><\/details><details class=\"card\"><summary>\ud83e\udded Populasi, sampel, dan triangulasi<\/summary><p><b>Populasi<\/b> adalah seluruh kelompok yang diteliti, <b>sampel<\/b> adalah sebagian yang diambil. Sampel yang tak mewakili menghasilkan kesimpulan yang bias. <b>Triangulasi<\/b> berarti memeriksa temuan dengan beberapa teknik atau sumber agar lebih dipercaya.<\/p><\/details><details class=\"card\"><summary>\ud83c\udf10 Bermakna: triangulasi untuk warga digital<\/summary><p>Sebelum membagikan kabar, lakukan triangulasi mini: cek <b>minimal tiga sumber<\/b> berbeda (media tepercaya, data resmi, pihak yang terkait). Kabar yang hanya muncul di satu akun tidak layak langsung disebarkan.<\/p><\/details>',\n4:'<details class=\"card\"><summary>\ud83d\udee0\ufe0f Tips tiap langkah<\/summary><ul><li><b>Mengamati<\/b>: catat apa yang terlihat, bukan tafsiranmu.<\/li><li><b>Menanya<\/b>: gunakan pertanyaan terbuka (mengapa/bagaimana).<\/li><li><b>Mengumpulkan<\/b>: pilih teknik sesuai jenis data.<\/li><li><b>Mengorganisasikan<\/b>: kelompokkan data dalam tabel atau tema.<\/li><li><b>Menyimpulkan<\/b>: jawab pertanyaan, akui keterbatasan.<\/li><\/ul><\/details><details class=\"card\"><summary>\ud83e\udd1d Etika penelitian<\/summary><p>Minta izin (<i>informed consent<\/i>), jaga kerahasiaan identitas informan, jangan memaksa, dan jangan memalsukan data. Peneliti bertanggung jawab pada martabat orang yang diteliti.<\/p><\/details><details class=\"card\"><summary>\ud83c\udf10 Bermakna: etika dan jejak digital<\/summary><p>Etika penelitian sejalan dengan etika digital: minta izin sebelum memotret atau merekam orang, jangan membagikan data pribadi (nama, alamat, nomor telepon), dan sadari bahwa unggahan meninggalkan <b>jejak digital<\/b> yang sulit dihapus.<\/p><\/details>',\n6:'<details class=\"card\"><summary>\ud83c\udfaf Pilih produk sesuai audiens<\/summary><p>Tentukan dulu <b>untuk siapa<\/b> dan <b>untuk apa<\/b> hasil penelitianmu. Guru dan akademisi cocok dengan laporan, teman sebaya dengan carousel atau video, forum kelas dengan PPT. Apa pun produknya, sertakan: masalah, metode, temuan utama, kesimpulan, dan ajakan atau rekomendasi.<\/p><\/details><details class=\"card\"><summary>\ud83c\udf10 Bermakna: menyebarkan informasi dengan tanggung jawab<\/summary><p>Setiap kali kamu membuat carousel atau video, kamu menjadi <b>produsen informasi<\/b>. Tanyakan: apakah datanya benar, apakah ada yang dirugikan, dan apakah ajakannya membangun? Penelitian sosial melatih kita menyebarkan pengetahuan, bukan kegaduhan.<\/p><\/details>'};\nfunction mindful(el){var c=document.createElement('div');c.className='card act';\nc.innerHTML='<div class=\"lbl\">\ud83e\uddd8 JEDA BERKESADARAN<\/div><p><b>Tarik napas pelan 4 detik, hembuskan 4 detik. Lalu perhatikan pikiranmu: apa dugaan pertamamu?<\/b><\/p><p>Dari 100 siswa saat istirahat, berapa yang menurutmu lebih banyak bermain gawai daripada mengobrol? <b id=\"mv\">50<\/b>%<\/p><input type=\"range\" min=\"0\" max=\"100\" value=\"50\" style=\"width:100%;accent-color:var(--rose);height:36px\" aria-label=\"Dugaanmu dalam persen\"><button class=\"opt\" style=\"text-align:center;font-weight:700\">\ud83d\udd13 Bandingkan dengan data pengamatan<\/button><div class=\"fbx\"><\/div>';\nel.appendChild(c);var r=c.querySelector('input'),mv=c.querySelector('#mv');r.oninput=function(){mv.textContent=r.value};\nc.querySelector('button').onclick=function(){var g=+r.value,d=g-45,m=Math.abs(d)<=10?'Dugaanmu cukup dekat dengan data.':d>0?'Dugaanmu lebih tinggi dari data. Kesan kita bisa terbentuk oleh berita atau potongan video, bukan pengamatan menyeluruh.':'Dugaanmu lebih rendah dari data. Kita kadang meremehkan pola yang sebenarnya terjadi.';\nbeep(1);c.querySelector('.fbx').innerHTML='<div class=\"fb ok\"><b class=\"t\">Dugaanmu '+g+'%, data contoh 45%<\/b>'+m+'<small>Data contoh: 100 pengamatan function pilihKelas(pr,k){

 document.querySelectorAll("#"+pr+"_tabs .tab").forEach(b=>b.classList.toggle("on",b.dataset.k===k));

function isiSiswa(pr){

 if((pr==="b"||pr==="k")&&s)return route();
 document.getElementById(pr+"_kelas").value=s?s.kelas:"";document.getElementById(pr+"_no").value=s?s.no:"";
 if(pr==="l"&&s)(isL3()?gantiL3():gantiDraft());

function simpanDraft(id){

 const e=document.getElementById("saved");if(e)e.textContent="💾 Tersimpan "+new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
 progres();
}
function gantiDraft(){
 const T=[...document.querySelectorAll(".l_jwb")];if(!T.length)return;
 if(T.every(t=>!t.value.trim())){const dr=ls(dKey(curLkm,document.getElementById("l_nama").value))||[];T.forEach((t,k)=>t.value=dr[k]||"");progres()}else simpanDraft(curLkm);

function hapusDraft(id){try{localStorage.removeItem(dKey(id,v("l_nama")||"x"));localStorage.removeItem(dKey(id,"x"))}catch(e){}}
function progres(){
 const T=[...document.querySelectorAll(".l_jwb")];if(!T.length)return;
 const n=T.filter(t=>t.value.trim()).length;
 T.forEach((t,i)=>{const c=document.getElementById("ck"+i);if(c)c.textContent=t.value.trim()?"✅":"○"});
 document.getElementById("mpt").textContent=`✍️ ${n}/${T.length} terjawab`;
 document.getElementById("mpb").style.width=Math.round(n/T.length*100)+"%";
 document.getElementById("kbtn").textContent=n===T.length?"Kirim Jawaban 🚀":`Kirim Jawaban (${n}/${T.length})`;
}
function burst(el){
 const r=el.getBoundingClientRect();
 ["🎉","✨","🤝","🔍","📚","🌐"].forEach((c,i)=>{const s=document.createElement("span");s.textContent=c;s.className="fly";s.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;--dx:${(i-2.5)*28}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),1000)});
}
function pop(el){
 const e=el.classList.contains("emo")?el:el.querySelector(".emo")||el;
 e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop");burst(el);
 if(navigator.vibrate)navigator.vibrate(15);setTimeout(()=>e.classList.remove("pop"),600);
}

const nk=x=>String(x||"").trim().toLowerCase();
function rekap(k){

 const by=(a,s)=>a.filter(x=>nk(x.kelas)===nk(s.kelas)&&nk(x.nama)===nk(s.nama));
 return SISWA.filter(s=>s.kelas===k).sort((a,b)=>a.no-b.no).map(s=>{
  const ab=by(D.absen,s).filter(x=>String(x.tgl||"").slice(0,10)===tg).slice(-1)[0],kl=by(D.klik,s);
  const st=id=>{const r=kl.filter(x=>x.sumber===id);return r.some(x=>x.status==="Selesai")?2:r.length?1:0};
  const sk=by(D.mpi,s).map(x=>+x.skor).filter(x=>!isNaN(x));
  const k3=D.lkpd3.filter(x=>nk(x.kelas)===nk(s.kelas)&&(String(x.anggota||"").split(";").map(nk).includes(nk(s.nama))||nk(x.nama)===nk(s.nama))).slice(-1)[0];
  return {s,absen:ab?ab.status:"",v1:st("penelitian_video1"),v2:st("penelitian_video2"),md:st("penelitian_media")?1:0,skor:sk.length?Math.max(...sk):null,l3:!!k3,kel:k3?String(k3.kelompok||"").replace("Kelompok ","K"):""};
 });

 const ab=p.nama&&(ls("log_absen")||[]).filter(a=>a.tgl===tgl()&&a.nama===p.nama).slice(-1)[0];
 const todo=MATERI.filter(m=>m.buka&&!done.includes(m.id)).sort((a,b)=>a.deadline.localeCompare(b.deadline))[0];
 const sisa=todo?Math.ceil((new Date(todo.deadline+"T23:59")-new Date())/864e5):0;
 const h=new Date().getHours(),sapa=h<11?"Pagi":h<15?"Siang":h<18?"Sore":"Malam";
 const chip=n=>{const ms=MATERI.filter(m=>m.pertemuan===n),d=ms.filter(m=>done.includes(m.id)).length;return `<span class="bg-white/25 rounded-full px-3 py-1">Pertemuan ${n}: ${d}/${ms.length} ${d===ms.length&&ms.length?'✓':''}</span>`};
 const week=n=>`<h2 class="font-bold mt-5 mb-2 flex items-center gap-2"><span class="w-1.5 h-5 rounded bg-gradient-to-b from-sky-400 to-pink-400"></span>Pertemuan ${n}</h2>`+MATERI.filter(m=>m.pertemuan===n).map(m=>mcard(m,done.includes(m.id))).join("");
 return `<div class="fade relative overflow-hidden rounded-3xl shadow-lg h-44 mb-3 bg-white"><img src="${COVER}" alt="Sampul Sosiologi" class="w-full h-full object-cover"><div class="absolute inset-0 bg-gradient-to-t from-indigo-700/85 via-sky-500/10 to-transparent"></div><div class="absolute bottom-3 left-4 right-4 text-white"><div class="text-xs opacity-90">Kelas 10 · Semester Ganjil 2026/2027</div><div class="text-xl font-extrabold leading-tight">Sosiologi: Mengenal Masyarakat Kita</div></div></div>
 <section class="fade relative overflow-hidden rounded-3xl p-5 text-white bg-gradient-to-br from-sky-400 via-blue-500 to-indigo-500 shadow-lg">
  <div class="absolute -top-8 -right-8 w-36 h-36 rounded-full bg-white/15"></div><div class="absolute -bottom-10 right-10 w-24 h-24 rounded-full bg-pink-300/30"></div>
  <div class="absolute top-1 right-2 flex z-10">${["🌐","🤝","🔍"].map((e,i)=>`<span class="emo p-2 text-3xl" style="animation-delay:${i*.4}s" onclick="pop(this)">${e}</span>`).join("")}</div>
  <p class="text-sm opacity-90 relative">Selamat ${sapa} 🌤️</p>
  <h1 class="text-2xl font-extrabold relative">${p.nama?`Selamat Datang, ${p.nama.split(" ")[0]}! 👋`:"Selamat Datang! 👋"}</h1>
  <p class="text-sm opacity-90 mb-4 relative">${p.nama?`Kelas ${p.kelas} · No. ${p.no}`:"Siap Eksplorasi Masyarakat Hari Ini? 🌐"}</p>
  <div class="bg-white/20 backdrop-blur rounded-2xl p-3 relative">
   <div class="flex justify-between text-sm font-semibold mb-2"><span>Progress Belajar</span><span>${pct}%</span></div>
   <div class="h-3 rounded-full bg-white/30 overflow-hidden"><div class="bar h-full rounded-full bg-gradient-to-r from-pink-200 to-white" id="pb" data-w="${pct}%" style="width:0"></div></div>
   <div class="flex gap-2 text-xs mt-2 flex-wrap">${chip(1)}${chip(2)}<span class="py-1">${pct===100?"🎉 Hebat!":"💪 Semangat!"}</span></div></div></section>
 ${p.nama?"":`<section class="card mt-4 fade border-2 border-dashed border-sky-200"><b>👋 Halo, Sobat Sosiologi! Yuk, kenalan dulu</b><p class="text-xs text-slate-500 mb-1">Pilih kelas dan namamu satu kali saja ya, nanti aplikasi akan mengingatnya otomatis 😊</p>${siswaFields("b")}</section>`}
 <section class="card mt-4 fade border-l-4 border-sky-300"><b class="flex items-center gap-2 mb-2">🗓️ Jadwal &amp; Tenggat Pertemuan 1</b>
  <div class="text-sm space-y-2">
   <div class="rounded-xl bg-sky-50 px-3 py-2"><b>📝 Absen</b> · ${dtW(WT(JADWAL.absen[0].mulai),{weekday:"long",day:"numeric",month:"long",year:"numeric"})}<br>${JADWAL.absen.map(w=>`Kelas ${wKelas(w)}: ${fmtJ(w,1)}`).join("<br>")}</div>
   <div class="rounded-xl bg-sky-50 px-3 py-2"><b>🎮 Baca &amp; isi Media Interaktif</b><br>Kelas ${wKelas(JADWAL.media[0])}: ${fmtJ(JADWAL.media[0])}</div>
   <div class="rounded-xl bg-sky-50 px-3 py-2"><b>✏️ LKPD 3</b><br>${wKelas(JADWAL.lkpd3[0])}: ${fmtJ(JADWAL.lkpd3[0])}</div></div></section>
 <section class="card mt-4 fade border-l-4 border-pink-300"><b class="flex items-center gap-2 mb-2">📣 Pengumuman &amp; Tugas</b>
  <div class="text-sm space-y-3">
   <div class="flex items-center gap-2 rounded-xl px-3 py-2 ${ab?'bg-emerald-50 text-emerald-700':'bg-amber-50 text-amber-700'}">${ab?`✅ Absen hari ini: <b>${ab.status}</b>`:`⏰ Kamu belum absen hari ini.`}</div>${ab?"":`<a href="#/absen" class="tbtn rounded-xl bg-amber-100 text-amber-800 font-bold">Absen sekarang →</a>`}
   <div class="flex items-center gap-2 rounded-xl px-3 py-2 ${todo?(sisa<=1?'bg-rose-50 text-rose-600':'bg-sky-50 text-sky-700'):'bg-emerald-50 text-emerald-700'}">${todo?`📝 LKM <b>${todo.judul}</b> · batas ${fmtTgl(todo.deadline)} (${sisa<0?'terlambat':sisa===0?'hari ini!':sisa+' hari lagi'})`:'🎉 Semua LKM yang terbuka sudah selesai!'}</div></div></section>
 <div class="grid grid-cols-2 gap-3 mt-4">
  <a href="#/absen" class="mcard rounded-2xl p-4 text-white bg-gradient-to-br from-teal-300 to-cyan-500 shadow"><div class="text-3xl emo">📝</div><b class="block mt-1">Absensi</b><span class="text-xs opacity-90">${ab?'Sudah absen ✓':'Belum absen'}</span></a>
  <a href="#/lkm" class="mcard rounded-2xl p-4 text-white bg-gradient-to-br from-pink-300 to-fuchsia-400 shadow"><div class="text-3xl emo" style="animation-delay:.5s">✏️</div><b class="block mt-1">LKM</b><span class="text-xs opacity-90">${done.length}/${MATERI.length} selesai</span></a></div>
 ${week(1)}${week(2)}
 <p class="text-center text-xs text-slate-400 mt-6 mb-2"><a href="#/guru">🔐 Akses Guru</a></p>`},
"/absen":()=>`<div class="card fade"><h2 class="font-bold text-lg">📝 Absensi Kehadiran</h2><p class="text-sm text-slate-500 mb-3">Halo! Senang bertemu denganmu hari ini 🌟 Pilih kelas dan namamu, lalu beri tahu kami kabarmu ya.</p>
 ${siswaFields("a")}<div id="a_jadwal" class="mt-2"></div>
 <label>Bagaimana kabarmu hari ini?</label><select id="a_status"><option>Hadir</option><option>Izin</option><option>Sakit</option></select>
 <button class="btn" id="a_btn" onclick="absen()">Kirim Absen</button><p id="msg" class="text-sm text-center mt-3"></p></div>
 <div class="card fade" id="riwayat"></div>`,
"/guru":()=>GURU.data?`<div class="card fade"><div class="flex justify-between items-start gap-2"><div><h2 class="font-bold text-lg">👩‍🏫 Dashboard Guru</h2><p class="text-sm">Mutiara Sissi Prisscila, S.Sos.</p><p class="text-xs text-slate-500">Sosiologi Kelas X · Semester Ganjil 2026/2027</p></div><button class="tbtn rounded-xl bg-white shadow-sm px-3" onclick="masukGuru()">🔄 Muat ulang</button></div>${API_URL?"":`<div class="rounded-xl bg-amber-100 text-amber-900 px-3 py-2 text-sm mt-3">🧪 Mode demo: hanya menampilkan data yang tersimpan di perangkat ini. Isi API_URL agar data seluruh siswa masuk ke sini.</div>`}<button class="tbtn rounded-xl bg-slate-100 text-slate-600 mt-3" onclick="GURU.data=null;GURU.pin='';route()">Keluar</button></div><div id="g_body">${guruView()}</div>`
 :`<div class="card fade"><h2 class="font-bold text-lg">🔐 Akses Guru</h2><p class="text-sm text-slate-500 mb-3">Khusus Ibu Mutiara Sissi Prisscila, S.Sos.</p>${API_URL?`<label>PIN Guru</label><input id="g_pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Masukkan PIN" onkeydown="if(event.key==='Enter')masukGuru()">`:`<p class="text-sm text-slate-500 mb-2">Mode demo: data diambil dari perangkat ini.</p>`}<button class="btn" onclick="masukGuru()">Masuk</button><p id="g_msg" class="text-sm text-center mt-3 text-rose-600"></p></div>`,
"/media":()=>{const j=jendela("media",profil().kelas);if(!j.buka)return `<div class="card fade">${kosong("🎮","Media Interaktif sedang ditutup",fmtJ(j.w))}<a href="#/" class="tbtn rounded-xl bg-white shadow-sm">← Kembali ke Beranda</a></div>`;return `${infoJ(j,"Media Interaktif")}<div class="fade"><div class="flex items-center justify-between gap-3 mb-2"><b><span class="emo">🎮</span> Media Pembelajaran Interaktif</b><a href="#/" class="tbtn rounded-xl bg-white px-4 shadow-sm">✕ Tutup</a></div>
 <iframe id="mpi" title="Media Interaktif Penelitian Sosial Sederhana" class="w-full rounded-2xl border border-slate-200 bg-white shadow" style="height:calc(100dvh - 17rem);min-height:380px"></iframe>
 <div id="bukti"></div><a href="#/lkm/penelitian" class="tbtn rounded-xl bg-pink-50 text-pink-600 font-semibold mt-3">✏️ Selesai? Lanjut ke LKPD 3</a></div>`},
"/bacaan":()=>(profil().nama?"":`<section class="card fade border-2 border-dashed border-sky-200"><b>👋 Halo, Sobat Sosiologi! Yuk, kenalan dulu</b><p class="text-xs text-slate-500 mb-1">Pilih kelas dan namamu agar gurumu bisa melihat bahwa kamu sudah membaca dan menonton 😊</p>${siswaFields("k")}</section>`)+MATERI.map(m=>`<div class="card fade"><div class="flex items-center gap-3"><div class="w-12 h-12 shrink-0 rounded-xl bg-gradient-to-br ${m.warna} flex items-center justify-center text-2xl" onclick="pop(this)"><span class="emo">${m.ikon}</span></div><div><span class="tag bg-sky-100 text-sky-700">Pertemuan ${m.pertemuan}</span><h3 class="font-bold">${m.judul}</h3></div></div>
 <p class="text-sm my-3 leading-relaxed">${m.isi}</p>
 ${m.link?`<a target="_blank" rel="noopener" href="${m.link}" class="tbtn rounded-xl bg-pink-50 text-pink-600 font-semibold">📎 Buka dokumen / video</a>`:""}${(m.videos||[]).length?`<div class="rounded-2xl bg-rose-50 border border-rose-100 p-3 mt-1"><b class="text-sm">🎬 Video Referensi</b><p class="text-xs text-slate-500">Klik tombol video, lalu tandai setelah selesai menonton.</p><div class="space-y-3 mt-2">${m.videos.map((u,i)=>{const id=m.id+"_video"+(i+1),lb="Video Referensi "+(i+1);return `<div class="space-y-2"><a target="_blank" rel="noopener" href="${u}" onclick="bukaSumber(event,'${id}','Video','${lb}')" class="tbtn rounded-xl bg-white text-rose-600 font-semibold shadow-sm">▶️ Tonton Video ${i+1}</a><div id="chip_${id}">${chipIn(id,"Video",lb)}</div></div>`}).join("")}</div></div>`:""}${m.media?`<div class="rounded-2xl bg-indigo-50 border border-indigo-100 p-3 mt-3 space-y-2"><a href="#/media" onclick="bukaSumber(event,'${m.id}_media','Media','Media Pembelajaran Interaktif')" class="tbtn rounded-xl bg-white text-indigo-700 font-semibold shadow-sm">🎮 Buka Media Interaktif</a><div id="chip_${m.id}_media">${chipIn(m.id+"_media","Media","Media Pembelajaran Interaktif")}</div></div>`:""}</div>`).join(""),
"/lkm":(id)=>{
 if(!id){const d=doneList();return MATERI.map(m=>`<a href="#/lkm/${m.id}" class="card mcard block fade"><div class="flex items-center gap-3"><span class="text-2xl">${m.ikon}</span><div class="flex-1"><b>${m.judul}</b><div class="text-xs text-slate-500">Pertemuan ${m.pertemuan} · ${nQ(m)}${draftInfo(m,d)}</div></div>${badge(m,d.includes(m.id))}</div></a>`).join("")}
 const m=MATERI.find(x=>x.id===id);if(!m)return "<p>LKM tidak ditemukan.</p>";
 if(!m.buka)return `<div class="card">🔒 LKM ini belum dibuka. Tunggu instruksi dari Bapak/Ibu Guru.</div>`;
 if(m.lkpd)return lkpd3Page();
 const sl=idxProfil(),dr=ls(dKey(id,sl>=0?sl:"x"))||[];
 return `<div class="card fade"><h2 class="font-bold text-lg">✏️ LKM: ${m.judul}</h2><p class="text-xs text-slate-500 mb-3">Baca materinya dulu, lalu jawab dengan kalimatmu sendiri.</p>
 ${siswaFields("l")}
 <div class="rounded-2xl bg-sky-50 p-3 mb-3"><div class="flex justify-between items-center gap-2 text-sm font-semibold"><span id="mpt">✍️ 0/${m.lkm.length} terjawab</span><span id="saved" class="text-xs text-slate-400 font-normal">💾 Tersimpan otomatis</span></div><div class="h-2.5 rounded-full bg-sky-100 mt-2 overflow-hidden"><div id="mpb" class="bar h-full rounded-full bg-gradient-to-r from-sky-400 to-pink-400" style="width:0"></div></div></div>
 ${m.lkm.map((q,i)=>`<label>${i+1}. ${q} <span id="ck${i}" class="text-slate-300">○</span></label><textarea rows="4" class="l_jwb" oninput="simpanDraft('${m.id}')" placeholder="Ketik jawabanmu...">${esc(dr[i]||"")}</textarea>`).join("")}
 <button id="kbtn" class="btn pink" onclick="kirimLkm('${m.id}')">Kirim Jawaban</button><p id="msg" class="text-sm text-center mt-3"></p></div>`}
};
const v=id=>document.getElementById(id).value.trim();
async function absen(){
 const s=SISWA[v("a_nama")];
 if(!s)return msg("Pilih kelas dan namamu dulu ya 🙂",1);
 const jw=jendela("absen",s.kelas);if(!jw.buka){updAbsen(s.kelas);return msg("Absen kelas "+s.kelas+" sedang ditutup. Jadwal: "+fmtJ(jw.w),1)}
 const d={nama:s.nama,kelas:s.kelas,no:s.no,status:v("a_status")};
 if(await kirim("absen",d)){msg("Absen tercatat ✅ "+now());riwayat(s.kelas)}else msg("Gagal mengirim, coba lagi.",1);
}
async function kirimLkm(id){
 const s=SISWA[v("l_nama")];
 if(!s)return msg("Pilih kelas dan namamu dulu ya 🙂",1);
 const d={nama:s.nama,kelas:s.kelas,no:s.no,lkm:id};
 const j=[...document.querySelectorAll(".l_jwb")].map(t=>t.value.trim());
 if(j.some(x=>!x))return msg("Isi semua jawaban dulu ya 🙂",1);
 j.forEach((x,i)=>d["jawaban_"+(i+1)]=x);
 if(await kirim("lkm",d)){const k=keyDone(),a=ls(k)||[];if(!a.includes(id))a.push(id);ls(k,a);hapusDraft(id);msg("Jawaban terkirim 🎉 Kembali ke Beranda untuk melihat progress-mu.")}else msg("Gagal mengirim, coba lagi.",1);
}
function msg(t,err){const e=document.getElementById("msg");e.textContent=t;e.style.color=err?"#d9534f":"#2e8b57";if(!err)burst(e)}
function route(){
 const [,r,id]=(location.hash.slice(1)||"/").match(/^(\/[^/]*)\/?(.*)$/)||[,"/",""];
 curLkm=r==="/lkm"?id:"";
 document.getElementById("app").innerHTML=(pages[r]||pages["/"])(id);
 if(curLkm)progres();
 if(isL3()&&document.getElementById("l3body"))l3step(0);
 if(r==="/media"&&document.getElementById("mpi")){document.getElementById("mpi").srcdoc=MPI_HTML;logKlik("penelitian_media","Media","Media Pembelajaran Interaktif","Dibuka");tampilBukti()}
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===r));
 if(r==="/absen"){riwayat(kelasAktif("a"));updAbsen(kelasAktif("a"))}
 const b=document.getElementById("pb");if(b)setTimeout(()=>b.style.width=b.dataset.w,80);
 window.scrollTo(0,0);
}
addEventListener("hashchange",route);route();
</script></body></html>
